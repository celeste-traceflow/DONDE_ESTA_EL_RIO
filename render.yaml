databases:
  - name: rio-de-recuerdos-db
    databaseName: rio_de_recuerdos
    user: rio_de_recuerdos
    plan: basic-256mb

services:
  - type: web
    name: rio-de-recuerdos-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

  - type: web
    name: rio-de-recuerdos-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rio-de-recuerdos-db
          property: connectionString
